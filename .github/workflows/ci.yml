name: Hisaab CI - Correctness & Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compliance-and-ledger:
    name: Financial Compliance & Core Invariants
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install pyyaml

      - name: Phase 1.1: Spec Coverage Verification (23/23 ECs)
        run: python scripts/check_spec_coverage.py

      - name: Phase 1.2: Zero Real Financial PII Scanner
        run: python scripts/check_real_data.py

      - name: Phase 1.3: PostgreSQL DDL & Immutability Trigger Check
        run: python scripts/verify_sql_schema.py

      - name: Phase 2.1: Double-Entry Core Ledger & Invariants (M1)
        run: go test -v ./internal/ledger/...

      - name: Phase 2.2: Indian Banking Calendar & RBI Rules
        run: go test -v ./internal/calendar/...

      - name: Phase 2.3: SA Simulator Matching & Refunds (M2)
        run: go test -v ./internal/settlement/...

      - name: Phase 2.4: NP Toolkit, Logistics & Tax Withholding (M3)
        run: go test -v ./internal/nptoolkit/...

      - name: Phase 2.5: Three-Way Recon Engine (M4)
        run: go test -v ./internal/recon/...

      - name: Phase 2.6: Verification Harness & Failpoints (M5)
        run: go test -v ./internal/verification/...

      - name: Phase 2.7: Formal Mutation Testing Harness (M5.8 - 100% Score)
        run: go test -v ./tests/mutation/...

      - name: Phase 2.8: Declarative Scenario DSL Runner (M0.2)
        run: go test -v ./internal/scenariodsl/...

      - name: Phase 2.9: 8 Crash Failpoints & Property Fuzzing
        run: |
          go test -v ./tests/crash/...
          go test -v ./tests/property/...
          go test -v ./tests/scenarios/...

  benchmarks-and-binaries:
    name: Production Binaries & Benchmarks
    runs-on: ubuntu-latest
    needs: compliance-and-ledger

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build hisaab-api binary
        run: go build -o bin/hisaab-api ./cmd/api

      - name: Build hisaab-worker binary
        run: go build -o bin/hisaab-worker ./cmd/worker

      - name: Build hisaab-cli binary
        run: go build -o bin/hisaab-cli ./cmd/cli

      - name: Execute Two-Level vs Naive Benchmarks
        run: go test -v -bench=. -benchmem ./tests/bench/...

      - name: Execute Scenario DSL on Sample Scenarios via CLI
        run: |
          ./bin/hisaab-cli run-scenario spec/scenarios/ec-03.yaml
          ./bin/hisaab-cli run-scenario spec/scenarios/ec-16.yaml
          ./bin/hisaab-cli run-scenario spec/scenarios/ec-22.yaml

  ops-console:
    name: Next.js 15 Ops Console
    runs-on: ubuntu-latest
    needs: compliance-and-ledger

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: console/package-lock.json

      - name: Install dependencies
        working-directory: console
        run: npm ci

      - name: TypeScript Type-Check
        working-directory: console
        run: npm run type-check

      - name: Production Build
        working-directory: console
        run: npm run build
