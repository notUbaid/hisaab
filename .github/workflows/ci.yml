name: Hisaab CI - Correctness & Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compliance-and-ledger:
    name: Financial Compliance & Core Invariants
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hisaab
          POSTGRES_PASSWORD: hisaab_dev_password
          POSTGRES_DB: hisaab
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: "Phase 1: PostgreSQL DDL & Immutability Trigger Validation"
        run: python scripts/verify_sql_schema.py

      - name: "Phase 2: Apply PostgreSQL 16 DDL Migration"
        env:
          PGPASSWORD: hisaab_dev_password
        run: |
          sed -e '/-- goose Down/,$d' db/migrations/00001_init.sql | psql -h localhost -U hisaab -d hisaab
          psql -h localhost -U hisaab -d hisaab -c "SELECT count(*) FROM accounts;"

      - name: "Phase 3.1: Double-Entry Core Ledger & Live PostgreSQL Conformance"
        env:
          DATABASE_URL: postgres://hisaab:hisaab_dev_password@localhost:5432/hisaab?sslmode=disable
        run: go test -v ./internal/ledger/...

      - name: "Phase 3.2: Adversarial Audit Test Suite (A1-A11)"
        run: go test -v ./tests/adversarial/...

      - name: "Phase 3.3: Indian Banking Calendar & RBI Rules"
        run: go test -v ./internal/calendar/...

      - name: "Phase 3.4: SA Simulator Matching & Refunds"
        run: go test -v ./internal/settlement/...

      - name: "Phase 3.5: NP Toolkit, Logistics & Tax Withholding"
        run: go test -v ./internal/nptoolkit/...

      - name: "Phase 3.6: Three-Way Recon Engine"
        run: go test -v ./internal/recon/...

      - name: "Phase 3.7: Cryptographic Merkle Audit Engine"
        run: go test -v ./internal/audit/...

      - name: "Phase 3.8: Verification Harness & Failpoints"
        run: go test -v ./internal/verification/...

      - name: "Phase 3.9: Formal Mutation Testing Harness (100% Score)"
        run: go test -v ./tests/mutation/...

      - name: "Phase 3.10: Declarative Scenario DSL Runner"
        run: go test -v ./internal/scenariodsl/...

      - name: "Phase 3.11: Crash Failpoints, Property Fuzzing & Scenarios"
        run: |
          go test -v ./tests/crash/...
          go test -v ./tests/property/...
          go test -v ./tests/scenarios/...

      - name: "Phase 3.12: Envelope Field Encryption (ADR-002)"
        run: go test -v ./internal/crypto/...

      - name: "Phase 3.13: Rate Limiting & RBAC Middleware (ADR-003)"
        run: go test -v ./internal/auth/...

      - name: "Phase 3.14: API Server Integration & Route Protection"
        run: go test -v ./cmd/api/...

  benchmarks-and-binaries:
    name: Production Binaries & Benchmarks
    runs-on: ubuntu-latest
    needs: compliance-and-ledger

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build hisaab-api binary
        run: go build -o bin/hisaab-api ./cmd/api

      - name: Build hisaab-worker binary
        run: go build -o bin/hisaab-worker ./cmd/worker

      - name: Build hisaab-cli binary
        run: go build -o bin/hisaab-cli ./cmd/cli

      - name: Execute Two-Level vs Naive Benchmarks
        run: go test -v -bench=. -benchmem ./tests/bench/...

      - name: Execute All 22 Declarative Scenarios via hisaab-cli
        run: |
          for f in spec/scenarios/ec-*.yaml; do
            ./bin/hisaab-cli run-scenario "$f"
          done

  ops-console:
    name: Next.js 15 Ops Console
    runs-on: ubuntu-latest
    needs: compliance-and-ledger

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: console/package-lock.json

      - name: Install dependencies
        working-directory: console
        run: npm ci

      - name: TypeScript Type-Check
        working-directory: console
        run: npm run type-check

      - name: Unit & Invariant Component Tests
        working-directory: console
        run: npm run test

      - name: Production Build
        working-directory: console
        run: npm run build
