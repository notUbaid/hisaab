id: EC-11
title: "Duplicate /settle submission with identical message_id (Idempotent Replay)"
spec_version: "RSF-2.0-BRD-2024-08-02"
brd_section: "Section 4.2, Case 11"

given:
  collector_account: "collector:ondc_settlement"
  collector_balance_paise: 5000000
  np_pair: "NP-BUYER-01:NP-SELLER-01"
  settlement_date: "2026-10-30"
  buyer_claim:
    message_id: "msg-buyer-ec11-replay"
    orders:
      - order_id: "ORD-20261030-1101"
        amount_paise: 100000
        commission_paise: 3000
        bff_paise: 1000
        sor_due_paise: 96000
  seller_claim:
    message_id: "msg-seller-ec11-replay"
    orders:
      - order_id: "ORD-20261030-1101"
        amount_paise: 100000
        commission_paise: 3000
        bff_paise: 1000
        sor_due_paise: 96000

then:
  match_status: "MATCHED"
  matched_orders_count: 1
  unmatched_orders_count: 0
  net_payout_paise: 99000
  collector_final_balance_paise: 4901000
  invariants_checked:
    - Invariant1_ZeroSum
    - Invariant3_Idempotency
    - Invariant4_NonNegativeConstrainedBalance
    - Invariant5_OrderConservation
    - Invariant13_GrossNetTieOut
