id: EC-08
title: "Order Amount Mismatch between Buyer App and Seller App claims"
spec_version: "RSF-2.0-BRD-2024-08-02"
brd_section: "Section 4.2, Case 8"

given:
  collector_account: "collector:ondc_settlement"
  collector_balance_paise: 5000000
  np_pair: "NP-BUYER-01:NP-SELLER-01"
  settlement_date: "2026-10-30"
  buyer_claim:
    message_id: "msg-buyer-ec08-001"
    orders:
      - order_id: "ORD-MISMATCH-01"
        amount_paise: 100000
        commission_paise: 3000
        bff_paise: 1000
  seller_claim:
    message_id: "msg-seller-ec08-001"
    orders:
      - order_id: "ORD-MISMATCH-01"
        amount_paise: 120000 # Seller claims ₹1,200 vs Buyer ₹1,000
        commission_paise: 3000
        bff_paise: 1000

then:
  match_status: "UNMATCHED"
  matched_orders_count: 0
  unmatched_orders_count: 1
  net_payout_paise: 0
  collector_final_balance_paise: 5000000
  invariants_checked:
    - Invariant1_ZeroSum
    - Invariant4_NonNegativeConstrainedBalance
